# Compatibility shim only. Prefer pyproject.toml.
# Version is NOT declared here — it is read dynamically from
# pms_trace.__version__ via [tool.setuptools.dynamic] in pyproject.toml.
# Do not re-add a version= line; that is how releases drift.

[metadata]
name = pms-trace
description = Solver-driven PMS<->channel reservation investigator
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
requires_python = >=3.9

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    pms-trace = pms_trace.cli:main

[options.data_files]
share/pms_trace/backends =
    backends/s3grep.py
    backends/s3search.py
