[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pms-trace"
dynamic = ["version"]
description = "Solver-driven PMS<->channel reservation investigator"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []
authors = [{name = "Rodrigo Ramos"}]
keywords = ["pms", "ota", "channel-manager", "trace", "logs", "opensearch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Logging",
    "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
opensearch = ["opensearch-py>=2.4"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
    "build>=1.0",
    "twine>=4.0",
]
all = ["pms-trace[opensearch]"]

[project.scripts]
pms-trace = "pms_trace.cli:main"

[project.urls]
Homepage = "https://github.com/example/pms-trace"
Documentation = "https://github.com/example/pms-trace#readme"

[tool.setuptools.dynamic]
version = {attr = "pms_trace.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/pms_trace/backends" = ["backends/s3grep.py", "backends/s3search.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
